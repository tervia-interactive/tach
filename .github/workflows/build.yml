name: Build tach

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  test-host:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: Run host subsystem tests
      run: make test

  build-x86:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ i686, x86_64 ]

    steps:
    - uses: actions/checkout@v6

    - name: Install x86 toolchain and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-multilib \
          g++-multilib \
          binutils \
          xorriso \
          grub-pc-bin \
          grub-common \
          mtools \
          qemu-system-x86

    - name: Build ${{ matrix.arch }}
      run: make ARCH=${{ matrix.arch }} CROSS_COMPILE=

    - name: Create ISO for ${{ matrix.arch }}
      run: make iso ARCH=${{ matrix.arch }} CROSS_COMPILE=

    - name: SMP and userspace boot smoke test
      shell: bash
      run: |
        set +e
        if [ "${{ matrix.arch }}" = i686 ]; then
          qemu=qemu-system-i386
        else
          qemu=qemu-system-x86_64
        fi
        timeout 12s "$qemu" \
          -cdrom src/build/${{ matrix.arch }}/tach.iso \
          -display none -serial stdio -no-reboot -smp 2 -m 256M \
          > boot.log 2>&1
        status=$?
        set -e
        test "$status" -eq 124
        grep -F "scheduler: 2 CPU(s)" boot.log
        grep -F "PID 1 executing /sbin/init in userspace" boot.log
        grep -F "tach init: PID 1 online" boot.log
        grep -F "tach userspace shell" boot.log
        ! grep -F "userspace exited" boot.log

    - name: Upload binary
      uses: actions/upload-artifact@v6
      with:
        name: tach-${{ matrix.arch }}-kernel
        path: src/build/${{ matrix.arch }}/tach.bin
        retention-days: 30

    - name: Upload ISO
      uses: actions/upload-artifact@v6
      with:
        name: tach-${{ matrix.arch }}-iso
        path: src/build/${{ matrix.arch }}/tach.iso
        retention-days: 30

  build-arm:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ arm32, aarch64 ]

    steps:
    - uses: actions/checkout@v6

    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          gcc-aarch64-linux-gnu \
          binutils-arm-linux-gnueabihf \
          binutils-aarch64-linux-gnu

    - name: Build ${{ matrix.arch }}
      run: |
        if [ "${{ matrix.arch }}" == "arm32" ]; then
          make ARCH=arm32 CROSS_COMPILE=arm-linux-gnueabihf-
        else
          make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu-
        fi

    - name: Upload binary
      uses: actions/upload-artifact@v6
      with:
        name: tach-${{ matrix.arch }}-kernel
        path: src/build/${{ matrix.arch }}/tach.bin
        retention-days: 30

  build-riscv:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ riscv32, riscv64 ]

    steps:
    - uses: actions/checkout@v6

    - name: Install RISC-V toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-riscv64-linux-gnu \
          binutils-riscv64-linux-gnu

    - name: Build ${{ matrix.arch }}
      run: |
        make ARCH=${{ matrix.arch }} CROSS_COMPILE=riscv64-linux-gnu-

    - name: Upload binary
      uses: actions/upload-artifact@v6
      with:
        name: tach-${{ matrix.arch }}-kernel
        path: src/build/${{ matrix.arch }}/tach.bin
        retention-days: 30

  release:
    needs: [build-x86, build-arm]
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'

    steps:
    - uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir release-assets
        find artifacts -name "*.bin" -exec cp {} release-assets/ \;
        find artifacts -name "*.iso" -exec cp {} release-assets/ \;

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
